<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GIDEON Launch Film</title>
<style>
@font-face{font-family:'Space Grotesk';font-weight:400;src:url(assets/fonts/space-grotesk-latin-400-normal.woff2)}
@font-face{font-family:'Space Grotesk';font-weight:500;src:url(assets/fonts/space-grotesk-latin-500-normal.woff2)}
@font-face{font-family:'Space Grotesk';font-weight:600;src:url(assets/fonts/space-grotesk-latin-600-normal.woff2)}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url(assets/fonts/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(assets/fonts/ibm-plex-sans-latin-400-normal.woff2)}
@font-face{font-family:'IBM Plex Sans';font-weight:500;src:url(assets/fonts/ibm-plex-sans-latin-500-normal.woff2)}
@font-face{font-family:'IBM Plex Sans';font-weight:600;src:url(assets/fonts/ibm-plex-sans-latin-600-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(assets/fonts/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:500;src:url(assets/fonts/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:600;src:url(assets/fonts/jetbrains-mono-latin-600-normal.woff2)}
@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(assets/fonts/jetbrains-mono-latin-700-normal.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'IBM Plex Sans',sans-serif;color:#E6EAE7;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden;perspective:2200px;transform-origin:50% 50%}
.a{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.mono{font-family:'JetBrains Mono',monospace}
.h{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.035em;line-height:1.04;white-space:nowrap}
.w{display:inline-block;white-space:pre}
.it{color:#3FD68F}
.cursor{width:40px;height:40px}
.kick{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.26em;color:#3FD68F;white-space:nowrap}
.dot{width:10px;height:10px;background:#3FD68F;border-radius:50%;display:inline-block;box-shadow:0 0 12px #3FD68F;vertical-align:middle}
.para{font-size:28px;line-height:1.5;color:#94A09A;width:640px}

/* logo */
.lgm{display:grid;place-items:center}
.lgm svg{position:absolute;inset:0}
.lgm-g{font-family:'Space Grotesk',sans-serif;font-weight:700;color:#3FD68F;line-height:1;position:relative}
.lgw{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:.16em;white-space:nowrap;color:#E6EAE7;line-height:1}
.lgw .ch{display:inline-block;text-align:center}

/* terminal */
.term{width:1440px;background:#0B0E0C;border:1px solid rgba(255,255,255,.1);box-shadow:0 60px 120px -40px rgba(0,0,0,.9)}
.term-h{height:62px;display:flex;align-items:center;gap:12px;padding:0 26px;border-bottom:1px solid rgba(255,255,255,.08);font-family:'JetBrains Mono',monospace;font-size:19px;color:#5C6662;letter-spacing:.06em}
.term-h i{width:14px;height:14px;border-radius:50%;background:#2A302C}
.term-h span{margin-left:14px}
.term-h b{margin-left:auto;color:#3FD68F;font-weight:600;letter-spacing:.14em;font-size:17px}
.term-h b .dot{width:9px;height:9px}
.term-b{padding:26px 34px 30px;font-family:'JetBrains Mono',monospace;font-size:27px;line-height:1.9;white-space:pre;height:470px}
.ln .tm{color:#5C6662}.ln .tg{color:#3FD68F;font-weight:700}.ln .dm{color:#7C8781}.ln .am{color:#E0B25C;font-weight:600}.ln .rd{color:#F0605D}
.caret{display:inline-block;width:13px;height:28px;background:#3FD68F;vertical-align:-5px;margin-left:4px}

/* flow */
.lk{fill:none;stroke:rgba(63,214,143,.45);stroke-width:2.5;stroke-dasharray:1 1}
.lk.ex{stroke:rgba(63,214,143,.7);stroke-width:3.5}
.node{background:#0E1210;border:1px solid rgba(255,255,255,.1);white-space:nowrap}
.src{display:flex;align-items:center;gap:16px;padding:16px 26px 16px 16px;font-size:27px;font-weight:500;width:250px}
.src i{width:40px;height:40px;display:grid;place-items:center;border:1px solid rgba(63,214,143,.5);color:#3FD68F;font-style:normal;font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600}
.gate,.cme{width:340px;padding:28px 30px}
.gate{border-color:#3FD68F}
.gh{font-family:'Space Grotesk',sans-serif;font-size:38px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:14px}
.lgs{width:44px;height:44px;border:1.5px solid #3FD68F;color:#3FD68F;display:grid;place-items:center;font-size:26px;font-weight:700}
.gk{font-family:'JetBrains Mono',monospace;font-size:17px;letter-spacing:.2em;color:#3FD68F;margin:14px 0 12px}
.cme .gk{letter-spacing:.08em;font-size:16px}
.gc{font-family:'JetBrains Mono',monospace;font-size:19px;color:#94A09A;line-height:1.75;display:flex;justify-content:space-between}
.gc b{color:#3FD68F}
.pk{width:18px;height:18px;border-radius:50%}
.burst{width:90px;height:90px;border-radius:50%;border:3px solid #F0605D}
.blk{font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;letter-spacing:.1em;color:#F0605D;background:rgba(240,96,93,.12);border:1px solid rgba(240,96,93,.6);padding:10px 18px;white-space:nowrap}
.stepl{text-align:center;white-space:nowrap}
.stepl div{font-family:'JetBrains Mono',monospace;font-size:21px;letter-spacing:.2em;color:#3FD68F}
.stepl span{display:block;margin-top:10px;font-size:26px;color:#94A09A}

/* kill switch */
.track{width:1365px;height:4px;background:rgba(255,255,255,.1)}
.track i{display:block;height:100%;width:0}
.tier{width:420px;height:380px;padding:36px 34px;border:1.5px solid rgba(255,255,255,.1);display:flex;flex-direction:column}
.tn{font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.24em}
.tt{font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:600;letter-spacing:-.03em;margin-top:26px;line-height:1.02}
.td{font-size:26px;color:#94A09A;margin-top:16px;line-height:1.4}
.ts{margin-top:auto;font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;letter-spacing:.24em}

/* audit */
.stack{width:860px;background:#0B0E0C;border:1px solid rgba(255,255,255,.1);padding:10px 0 14px;box-shadow:0 60px 120px -40px rgba(0,0,0,.9)}
.sh{font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.2em;color:#3FD68F;padding:16px 28px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.sh span{color:#5C6662}
.rec{display:flex;align-items:center;gap:18px;height:76px;padding:0 28px;font-family:'JetBrains Mono',monospace;font-size:21px;white-space:nowrap;border-left:3px solid transparent}
.rec.on{border-left-color:#3FD68F;background:rgba(63,214,143,.05)}
.rec .id{color:#5C6662}
.rec b{color:#3FD68F;width:92px}
.rec .tx{color:#C9D2CD;flex:1;overflow:hidden}
.seal{display:flex;align-items:center;gap:8px;color:#3FD68F;font-weight:600;font-size:16px;letter-spacing:.14em;border:1px solid rgba(63,214,143,.5);padding:6px 10px}
.file{width:270px;padding:24px 24px 22px;background:#0E1210;border:1px solid rgba(63,214,143,.45);box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.fx{font-family:'Space Grotesk',sans-serif;font-size:50px;font-weight:700;color:#3FD68F;letter-spacing:-.02em}
.fn{font-family:'JetBrains Mono',monospace;font-size:17px;color:#94A09A;margin-top:6px}
.fb{height:5px;background:rgba(255,255,255,.08);margin-top:18px}
.fb i{display:block;height:100%;background:#3FD68F;width:0}
.fs{font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.18em;margin-top:10px;font-weight:600}

/* browser */
.browser{width:1120px;height:730px;background:#0A0C0B;border:1px solid rgba(255,255,255,.14);box-shadow:0 80px 140px -40px rgba(0,0,0,.95),0 0 80px -20px rgba(63,214,143,.18);overflow:hidden}
.bh{height:52px;background:#141917;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.bh i{width:13px;height:13px;border-radius:50%;background:#2A302C}
.url{margin:0 auto;display:flex;align-items:center;gap:10px;background:#0A0C0B;border:1px solid rgba(255,255,255,.08);padding:6px 70px;font-family:'JetBrains Mono',monospace;font-size:18px;color:#C9D2CD;transform:translateX(-30px)}
.url svg{width:16px;height:16px}
.bv{height:678px;overflow:hidden}
.bv img{width:1120px;display:block}
.gp{display:flex;align-items:center;gap:12px;background:#0E1210;border:1px solid rgba(63,214,143,.4);padding:14px 20px;font-size:22px;font-weight:500;white-space:nowrap;box-shadow:0 20px 40px -14px rgba(0,0,0,.8)}
.gp i{width:10px;height:10px;background:#3FD68F;box-shadow:0 0 10px #3FD68F}

/* compliance */
.ctile{width:420px;height:200px;padding:28px 30px;background:#0E1210;border:1px solid rgba(255,255,255,.1)}
.ck{font-family:'JetBrains Mono',monospace;font-size:24px;letter-spacing:.14em;color:#3FD68F;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.ck b{width:40px;height:40px;background:#3FD68F;color:#0A0C0B;display:grid;place-items:center;font-size:24px}
.cx{font-size:25px;color:#94A09A;margin-top:18px;line-height:1.4}
.isnot{width:720px;padding:30px 36px;border:1px solid rgba(240,96,93,.3);background:rgba(240,96,93,.04)}
.nh{font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.2em;color:#F0605D;font-weight:600;margin-bottom:14px}
.ni{display:flex;align-items:center;gap:20px;font-size:32px;padding:12px 0;position:relative;white-space:nowrap}
.ni b{color:#F0605D;font-size:26px;width:28px;display:inline-block}
.ni span{position:relative;color:#C9D2CD}
.ni span::after{content:"";position:absolute;left:0;top:54%;height:2px;background:#F0605D;width:var(--st,0%)}

/* proof */
.big{font-family:'Space Grotesk',sans-serif;font-size:380px;font-weight:700;letter-spacing:-.06em;color:#0A0C0B;line-height:1}
.gstat{text-align:center;color:#0A0C0B;width:540px}
.gstat strong{display:block;font-family:'Space Grotesk',sans-serif;font-size:96px;font-weight:700;letter-spacing:-.04em;line-height:1.1;white-space:nowrap}
.gstat small{display:block;font-family:'JetBrains Mono',monospace;font-size:20px;letter-spacing:.16em;margin-top:10px;font-weight:600;opacity:.7}

/* outro */
.cta{font-family:'JetBrains Mono',monospace;font-size:32px;font-weight:600;letter-spacing:.12em;color:#0A0C0B;background:#3FD68F;padding:28px 52px;white-space:nowrap;box-shadow:0 0 60px -10px rgba(63,214,143,.6)}
.fine{width:1500px;text-align:center;font-size:16px;line-height:1.55;color:#5C6662}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------------------------------------------------------------------------
// Tiny deterministic motion engine: every frame is a pure function of time t.
// ---------------------------------------------------------------------------
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  spring: x => x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(11 * x),
};
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
// ramp from a to b between t0 and t1
const r = (t, t0, t1, a, b, e = E.outExpo) => t <= t0 ? a : t >= t1 ? b : a + (b - a) * e((t - t0) / (t1 - t0));
const p01 = (t, t0, t1, e = E.lin) => r(t, t0, t1, 0, 1, e);

const $stage = document.getElementById('stage');
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  (parent || $stage).appendChild(e);
  return e;
}
// centred absolute element
function A(parent, cls, html) { return el('div', 'a ' + (cls || ''), parent, html); }
function img(parent, src, cls) { const i = el('img', cls, parent); i.src = src; return i; }
function win(parent, src, w, h, pos) {
  const d = A(parent, 'win'); d.style.width = w + 'px'; d.style.height = h + 'px';
  const i = img(d, src); if (pos) i.style.objectPosition = pos; return d;
}
// Words wrapped in *...* are set in the italic serif.
function words(parent, text, cls, style) {
  const d = A(parent, 'h ' + (cls || ''));
  if (style) Object.assign(d.style, style);
  let italic = false;
  text.split(' ').forEach((w, i, arr) => {
    let s = w;
    const start = s.startsWith('*'); if (start) { italic = true; s = s.slice(1); }
    const end = s.endsWith('*'); if (end) s = s.slice(0, -1);
    const sp = el('span', 'w' + (italic ? ' it' : ''), d, s + (i < arr.length - 1 ? ' ' : ''));
    if (end) italic = false;
  });
  d._w = [...d.querySelectorAll('.w')];
  return d;
}
function set(e, p) {
  let tr = e._anchor === 'left' ? 'translate(0,-50%)' : 'translate(-50%,-50%)';
  tr += ` translate3d(${(p.x || 0).toFixed(2)}px,${(p.y || 0).toFixed(2)}px,${(p.z || 0).toFixed(2)}px)`;
  if (p.rx) tr += ` rotateX(${p.rx}deg)`;
  if (p.ry) tr += ` rotateY(${p.ry}deg)`;
  if (p.r) tr += ` rotate(${p.r}deg)`;
  tr += ` scale(${p.s === undefined ? 1 : p.s})`;
  e.style.transform = tr;
  e.style.opacity = p.o === undefined ? 1 : clamp(p.o);
  const f = [];
  if (p.blur > 0.05) f.push(`blur(${p.blur.toFixed(2)}px)`);
  if (p.bright !== undefined) f.push(`brightness(${p.bright})`);
  e.style.filter = f.length ? f.join(' ') : 'none';
}
function left(e) { e._anchor = 'left'; e.style.left = '50%'; return e; }
// staggered word rise with blur
function rise(d, t, t0, stagger = 0.055, dur = 0.8, dist = 70) {
  d._w.forEach((w, i) => {
    const p = clamp((t - t0 - i * stagger) / dur);
    const e = E.outExpo(p);
    w.style.transform = `translateY(${((1 - e) * dist).toFixed(2)}px)`;
    w.style.opacity = clamp(p * 3);
    w.style.filter = p < 1 ? `blur(${((1 - e) * 12).toFixed(2)}px)` : 'none';
  });
}
const pop = (t, t0, dur = 0.7) => r(t, t0, t0 + dur, 0, 1, E.spring);
const visible = (t, t0) => t >= t0 ? 1 : 0;

const CHECK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CURSOR = c => `<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.6 1.6-3.4 6.2z" fill="${c}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const ICON = {
  agent: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 13h.01M15 13h.01"/></svg>',
  task: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  bolt: '<svg viewBox="0 0 100 100"><polygon points="45.7,0 65.4,0 51.9,15.4 78.4,15.4 51.9,45.7 78.4,45.7 19.8,100 46.3,57.4 19.1,57.4 46.3,27.8 19.1,27.2" fill="#fff"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  tool: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z"/></svg>',
};
function pill(parent, label, color, icon) {
  return A(parent, 'pill', `<i style="background:${color}">${ICON[icon]}</i>${label}`);
}
function scene(bg, dark) {
  const s = el('div', 'scene' + (dark ? ' dark' : ''));
  s.style.background = bg; return s;
}

// ---------------------------------------------------------------------------
// Timeline (120 BPM → one beat = 0.5s). Scene boundaries land on bar lines.
// ---------------------------------------------------------------------------
const SCENES = [];
function addScene(start, end, build, update) {
  SCENES.push({ start, end, ctx: build(), update });
}
const DURATION = 48;
const G = '#3FD68F', AMB = '#E0B25C', ORG = '#EA8A4E', RED = '#F0605D', FG = '#E6EAE7', DIM = '#94A09A', DIM2 = '#5C6662';
const GRID = 'linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/64px 64px, linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/64px 64px';
const bg = (x = 50, y = 40, glow = 0.10) => `${GRID}, radial-gradient(ellipse at ${x}% ${y}%, rgba(63,214,143,${glow}), transparent 55%), #0A0C0B`;

// deterministic pseudo-random in [0,1) from two integers
function hash(a, b) {
  let h = Math.imul(a * 374761393 + b * 668265263, 1274126177);
  h ^= h >>> 13; h = Math.imul(h, 1103515245); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*/<>=+';
// monospace "decode" effect: revealed chars, a few scrambling chars, then padding
function decode(text, t, t0, dur) {
  const n = text.length, p = (t - t0) / dur * n;
  let out = '';
  for (let i = 0; i < n; i++) {
    const c = text[i];
    if (c === ' ' || i < p) out += c === ' ' ? ' ' : c;
    else if (i < p + 4) out += GLYPHS[Math.floor(hash(i, Math.floor(t * 30)) * GLYPHS.length)];
    else out += ' ';
  }
  return out;
}
// per-character spans for proportional text so scrambling never reflows
function charBox(parent, text, cls, style) {
  const d = A(parent, cls);
  if (style) Object.assign(d.style, style);
  d._c = [...text].map(ch => { const s = el('span', 'ch', d, ch); s._ch = ch; return s; });
  return d;
}
function scrambleChars(d, t, t0, stagger = 0.08, spin = 0.28) {
  if (!d._fixed) { d._c.forEach(s => { s.style.width = s.getBoundingClientRect().width + 'px'; }); d._fixed = true; }
  d._c.forEach((s, i) => {
    const ti = t0 + i * stagger;
    if (t < ti) { s.textContent = s._ch; s.style.opacity = 0; return; }
    s.style.opacity = 1;
    s.textContent = t < ti + spin && s._ch !== ' ' ? GLYPHS[Math.floor(hash(i + 7, Math.floor(t * 30)) * GLYPHS.length)] : s._ch;
    s.style.color = t < ti + spin ? G : '';
  });
}
function logoMark(parent, size) {
  const d = A(parent, 'lgm');
  d.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block;overflow:visible"><rect x="1.5" y="1.5" width="97" height="97" fill="rgba(63,214,143,.06)" stroke="${G}" stroke-width="3" pathLength="1" stroke-dasharray="1 1"/></svg><div class="lgm-g" style="font-size:${size * 0.55}px">G</div>`;
  d.style.width = d.style.height = size + 'px';
  d._rect = d.querySelector('rect'); d._g = d.querySelector('.lgm-g');
  return d;
}
function drawMark(d, p, gp) {

// ---------------------------------------------------------------------------
// Scene compositor: outgoing scene zooms/blurs away, incoming scales in.
// ---------------------------------------------------------------------------
const OUT = 0.34, IN = 0.42;
window.render = function (t) {
  SCENES.forEach((sc, i) => {
    const s = sc.ctx.s;
    const first = i === 0, last = i === SCENES.length - 1;
    const on = t >= sc.start - (first ? 0 : 0.18) && t < sc.end + (last ? 1 : OUT);
    s.style.visibility = on ? 'visible' : 'hidden';
    if (!on) return;
    sc.update(t, sc.ctx);
    const outP = last ? 0 : p01(t, sc.end - 0.12, sc.end + OUT, E.inCubic);
    const inP = first || i === 1 ? 1 : p01(t, sc.start - 0.18, sc.start + IN, E.outExpo);
    const sOut = 1 + outP * 0.16, sIn = 0.9 + inP * 0.1;
    s.style.transform = `scale(${(sOut * sIn).toFixed(4)})`;
    s.style.opacity = (first || i === 1 ? 1 : clamp(inP * 1.8)).toFixed(3);
    s.style.filter = outP > 0.01 ? `blur(${(outP * 18).toFixed(2)}px)` : 'none';
    s.style.zIndex = String(i);
  });
};
window.DURATION = DURATION;
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => console.warn('img fail', i.src))));
  return true;
})();
// Live preview when opened in a browser: ?t=12.5 freezes a frame, otherwise it plays.
const qs = new URLSearchParams(location.search);
if (!navigator.webdriver) {
  if (qs.has('t')) window.render(parseFloat(qs.get('t')));
  else { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
}
