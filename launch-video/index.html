<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Formata Energia Film</title>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(assets/fonts/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(assets/fonts/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(assets/fonts/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(assets/fonts/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(assets/fonts/inter-latin-800-normal.woff2)}
@font-face{font-family:Serif;font-style:normal;src:url(assets/fonts/instrument-serif-latin-400-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(assets/fonts/instrument-serif-latin-400-italic.woff2)}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:#191919;-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden;perspective:2200px;transform-origin:50% 50%}
.a{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.win{border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 50px 100px -30px rgba(15,15,15,.35),0 18px 36px -18px rgba(15,15,15,.25),0 0 0 1px rgba(15,15,15,.07)}
.win img{display:block;width:100%;height:100%;object-fit:cover;object-position:top left}
.h{font-weight:700;letter-spacing:-0.045em;line-height:1.04;white-space:nowrap}
.it{font-family:Serif;font-style:italic;font-weight:400;letter-spacing:-0.015em}
.w{display:inline-block;white-space:pre}
.chip{display:inline-flex;align-items:center;gap:14px;font-size:26px;font-weight:600;letter-spacing:-0.01em;padding:12px 24px 12px 14px;border-radius:999px;background:rgba(25,25,25,.06);white-space:nowrap}
.chip b{display:inline-flex;align-items:center;justify-content:center;height:34px;min-width:52px;padding:0 10px;border-radius:999px;background:#191919;color:#fff;font-size:18px;font-weight:700;letter-spacing:.02em}
.dark .chip{background:rgba(255,255,255,.1);color:#fff}
.dark .chip b{background:#fff;color:#111}
.pill{display:flex;align-items:center;gap:14px;background:#fff;border-radius:999px;padding:16px 28px 16px 18px;font-size:30px;font-weight:600;letter-spacing:-0.02em;white-space:nowrap;box-shadow:0 20px 40px -12px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.05)}
.pill i{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.pill i svg{width:24px;height:24px}
.para{font-size:30px;line-height:1.45;color:#6b6b6b;font-weight:500;letter-spacing:-0.01em;width:660px}
.tile{width:108px;height:108px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 36px -12px rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.05)}
.tile img{width:80px;height:80px;object-fit:contain}
.toast{display:flex;align-items:center;gap:18px;width:560px;height:80px;padding:0 24px;background:#fff;border-radius:18px;font-size:25px;font-weight:600;letter-spacing:-0.015em;box-shadow:0 20px 40px -14px rgba(120,50,10,.28),0 0 0 1px rgba(0,0,0,.04);white-space:nowrap}
.toast .ck{width:40px;height:40px;border-radius:50%;background:#2DA44E;display:flex;align-items:center;justify-content:center;flex:none}
.toast span{color:#8a8a8a;font-weight:500}
.cursor{width:40px;height:40px}
.tag{position:absolute;left:30px;top:32px;padding:6px 14px;border-radius:10px;color:#fff;font-size:20px;font-weight:600;white-space:nowrap}
.marquee{display:flex;align-items:center;gap:130px;white-space:nowrap}
.marquee img{height:54px;width:auto;filter:brightness(0) invert(1);opacity:.9}
.alert{display:flex;align-items:center;gap:16px;padding:14px 28px;border-radius:999px;background:rgba(225,37,27,.16);border:1.5px solid rgba(225,37,27,.7);color:#ff6b61;font-size:26px;font-weight:700;letter-spacing:.14em;white-space:nowrap}
.alert i{width:14px;height:14px;border-radius:50%;background:#ff3b30;box-shadow:0 0 18px #ff3b30}
.prod img{display:block;-webkit-box-reflect:below 2px linear-gradient(transparent 70%,rgba(0,0,0,.18));filter:drop-shadow(0 30px 30px rgba(0,0,0,.25))}
.tagp{background:#fff;border-radius:999px;padding:14px 26px;font-size:28px;font-weight:600;letter-spacing:-0.02em;white-space:nowrap;box-shadow:0 18px 36px -12px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.05)}
.tagp::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:#E1251B;margin-right:14px;vertical-align:middle;position:relative;top:-3px}
.pcard{width:600px;height:620px;border-radius:32px;background:#fff;box-shadow:0 50px 90px -30px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.05);display:flex;flex-direction:column;align-items:center;padding:40px 40px 44px}
.pcard .ph{flex:1;display:flex;align-items:center;justify-content:center;width:100%;background:radial-gradient(ellipse at 50% 85%,rgba(0,0,0,.08),transparent 60%)}
.pcard .ph img{max-width:480px;display:block;filter:drop-shadow(0 24px 22px rgba(0,0,0,.25))}
.pcard .nm{font-size:40px;font-weight:700;letter-spacing:-0.035em;margin-top:18px;white-space:nowrap}
.pcard .sp{font-size:26px;font-weight:600;color:#E1251B;margin-top:8px;white-space:nowrap}
.panel{width:1420px;height:520px;border-radius:32px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);box-shadow:0 60px 120px -40px rgba(0,0,0,.8);display:grid;grid-template-columns:900px 1fr;grid-template-rows:1fr 1fr;padding:34px 40px;gap:10px 40px;color:#fff}
.panel .row{grid-column:1;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid rgba(255,255,255,.08)}
.panel .row:nth-child(2){border-bottom:0}
.panel .lab{display:flex;align-items:center;gap:18px;font-size:28px;font-weight:600;letter-spacing:-0.02em}
.st{font-size:18px;font-weight:800;letter-spacing:.12em;padding:6px 14px;border-radius:8px}
.st.ok{background:rgba(53,208,127,.16);color:#35d07f}.st.bad{background:rgba(225,37,27,.25);color:#ff5a4f}
.panel .side{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;justify-content:space-around;border-left:1px solid rgba(255,255,255,.08);padding-left:40px}
.panel small{display:block;font-size:22px;color:#9a9a9a;font-weight:500}
.panel strong{display:block;font-size:56px;font-weight:800;letter-spacing:-0.04em}
.panel strong.load{font-size:30px;font-weight:600;letter-spacing:-0.02em}
.panel .bar{width:340px;height:10px;border-radius:5px;background:rgba(255,255,255,.1);margin-top:10px}
.panel .bar i{display:block;height:100%;border-radius:5px;background:#35d07f}
.nowin{background:transparent;box-shadow:none;border-radius:0}
.nowin img{object-fit:contain}
.egcard{background:#fff;border-radius:28px;padding:22px 34px;box-shadow:0 30px 60px -20px rgba(120,20,10,.35)}
.egcard img{height:190px;display:block}
.stat{text-align:center;color:#fff;width:460px}
.stat strong{display:flex;align-items:center;justify-content:center;height:120px;font-size:96px;font-weight:800;letter-spacing:-0.05em}
.stat strong img{height:120px;background:#fff;border-radius:18px;padding:8px 18px}
.stat small{display:block;margin-top:14px;font-size:30px;color:#9a9a9a;font-weight:500}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------------------------------------------------------------------------
// Tiny deterministic motion engine: every frame is a pure function of time t.
// ---------------------------------------------------------------------------
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  outBack: x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  spring: x => x >= 1 ? 1 : 1 - Math.exp(-6.5 * x) * Math.cos(11 * x),
};
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
// ramp from a to b between t0 and t1
const r = (t, t0, t1, a, b, e = E.outExpo) => t <= t0 ? a : t >= t1 ? b : a + (b - a) * e((t - t0) / (t1 - t0));
const p01 = (t, t0, t1, e = E.lin) => r(t, t0, t1, 0, 1, e);

const $stage = document.getElementById('stage');
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  (parent || $stage).appendChild(e);
  return e;
}
// centred absolute element
function A(parent, cls, html) { return el('div', 'a ' + (cls || ''), parent, html); }
function img(parent, src, cls) { const i = el('img', cls, parent); i.src = src; return i; }
function win(parent, src, w, h, pos) {
  const d = A(parent, 'win'); d.style.width = w + 'px'; d.style.height = h + 'px';
  const i = img(d, src); if (pos) i.style.objectPosition = pos; return d;
}
// Words wrapped in *...* are set in the italic serif.
function words(parent, text, cls, style) {
  const d = A(parent, 'h ' + (cls || ''));
  if (style) Object.assign(d.style, style);
  let italic = false;
  text.split(' ').forEach((w, i, arr) => {
    let s = w;
    const start = s.startsWith('*'); if (start) { italic = true; s = s.slice(1); }
    const end = s.endsWith('*'); if (end) s = s.slice(0, -1);
    const sp = el('span', 'w' + (italic ? ' it' : ''), d, s + (i < arr.length - 1 ? ' ' : ''));
    if (end) italic = false;
  });
  d._w = [...d.querySelectorAll('.w')];
  return d;
}
function set(e, p) {
  let tr = e._anchor === 'left' ? 'translate(0,-50%)' : 'translate(-50%,-50%)';
  tr += ` translate3d(${(p.x || 0).toFixed(2)}px,${(p.y || 0).toFixed(2)}px,${(p.z || 0).toFixed(2)}px)`;
  if (p.rx) tr += ` rotateX(${p.rx}deg)`;
  if (p.ry) tr += ` rotateY(${p.ry}deg)`;
  if (p.r) tr += ` rotate(${p.r}deg)`;
  tr += ` scale(${p.s === undefined ? 1 : p.s})`;
  e.style.transform = tr;
  e.style.opacity = p.o === undefined ? 1 : clamp(p.o);
  const f = [];
  if (p.blur > 0.05) f.push(`blur(${p.blur.toFixed(2)}px)`);
  if (p.bright !== undefined) f.push(`brightness(${p.bright})`);
  e.style.filter = f.length ? f.join(' ') : 'none';
}
function left(e) { e._anchor = 'left'; e.style.left = '50%'; return e; }
// staggered word rise with blur
function rise(d, t, t0, stagger = 0.055, dur = 0.8, dist = 70) {
  d._w.forEach((w, i) => {
    const p = clamp((t - t0 - i * stagger) / dur);
    const e = E.outExpo(p);
    w.style.transform = `translateY(${((1 - e) * dist).toFixed(2)}px)`;
    w.style.opacity = clamp(p * 3);
    w.style.filter = p < 1 ? `blur(${((1 - e) * 12).toFixed(2)}px)` : 'none';
  });
}
const pop = (t, t0, dur = 0.7) => r(t, t0, t0 + dur, 0, 1, E.spring);
const visible = (t, t0) => t >= t0 ? 1 : 0;

const I = n => `assets/img/${n}`;
const CHECK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CURSOR = c => `<svg class="cursor" viewBox="0 0 24 24"><path d="M4 2.5l15.5 9.2-6.6 1.6-3.4 6.2z" fill="${c}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const ICON = {
  agent: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="7" width="16" height="12" rx="4"/><path d="M12 3v4M9 13h.01M15 13h.01"/></svg>',
  task: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  mic: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
  bolt: '<svg viewBox="0 0 100 100"><polygon points="45.7,0 65.4,0 51.9,15.4 78.4,15.4 51.9,45.7 78.4,45.7 19.8,100 46.3,57.4 19.1,57.4 46.3,27.8 19.1,27.2" fill="#fff"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  tool: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7z"/></svg>',
};
function pill(parent, label, color, icon) {
  return A(parent, 'pill', `<i style="background:${color}">${ICON[icon]}</i>${label}`);
}
function scene(bg, dark) {
  const s = el('div', 'scene' + (dark ? ' dark' : ''));
  s.style.background = bg; return s;
}

// ---------------------------------------------------------------------------
// Timeline (120 BPM → one beat = 0.5s). Scene boundaries land on bar lines.
// ---------------------------------------------------------------------------
const SCENES = [];
function addScene(start, end, build, update) {
  SCENES.push({ start, end, ctx: build(), update });
}
const DURATION = 48;
const RED = '#E1251B';

// Formata logo, redrawn as vector from the original so it stays sharp at 1080p
// and so its strokes can be drawn on. viewBox 1240×250.
const BOLT = '45.7,0 65.4,0 51.9,15.4 78.4,15.4 51.9,45.7 78.4,45.7 19.8,100 46.3,57.4 19.1,57.4 46.3,27.8 19.1,27.2';
function boltSVG(size) {
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block"><rect width="100" height="100" fill="${RED}"/><polygon points="${BOLT}" fill="#fff"/></svg>`;
}
function logoSVG(width) {
  const c = [185, 297, 459, 591, 763, 915, 1047];
  const L = [
    `M${c[0] + 7},145 V32 H${c[0] + 92} M${c[0] + 7},86 H${c[0] + 80}`,
    `M${c[1] + 70},32 a63,53 0 1,0 0.01,0 Z`,
    `M${c[2] + 7},145 V32 H${c[2] + 72} a30,30 0 0 1 0,60 H${c[2] + 7} M${c[2] + 62},92 L${c[2] + 112},145`,
    `M${c[3] + 7},145 V28 L${c[3] + 75},112 L${c[3] + 143},28 V145`,
    `M${c[4]},145 L${c[4] + 65},27 L${c[4] + 130},145`,
    `M${c[5]},32 H${c[5] + 112} M${c[5] + 56},32 V145`,
    `M${c[6]},145 L${c[6] + 65},27 L${c[6] + 130},145`,
  ];
  return `<svg class="logo" width="${width}" viewBox="0 0 1240 250" style="display:block;overflow:visible">
    <g class="ic"><rect x="0" y="20" width="150" height="150" fill="${RED}"/><polygon transform="translate(0,20) scale(1.5)" points="${BOLT}" fill="#fff"/></g>
    ${L.map(d => `<path class="lt" d="${d}" pathLength="1" fill="none" stroke="#3b3b3b" stroke-width="15" stroke-linejoin="miter" stroke-dasharray="1 1"/>`).join('')}
    <path class="ln" d="M175,131 H1190 q34,0 34,24 t-34,24 H1172 M1172,170 v18" pathLength="1" fill="none" stroke="${RED}" stroke-width="5" stroke-dasharray="1 1"/>
    <text class="tg" x="1150" y="228" text-anchor="end" fill="${RED}" font-family="Inter" font-weight="500" font-size="44" letter-spacing="-0.5">soluções em energia e tecnologia</text>
  </svg>`;
}
// p ∈ [0,1] draws the logo on: icon, letters, red line, tagline.
function drawLogo(root, p, iconT = null) {
  const lts = root.querySelectorAll('.lt');
  lts.forEach((e, i) => e.setAttribute('stroke-dashoffset', (1 - clamp((p - i * 0.07) / 0.45)).toFixed(4)));
  root.querySelector('.ln').setAttribute('stroke-dashoffset', (1 - clamp((p - 0.45) / 0.4)).toFixed(4));
  root.querySelector('.tg').style.opacity = clamp((p - 0.75) / 0.25);
  if (iconT) root.querySelector('.ic').setAttribute('transform', iconT);
}
function productCard(parent, src, name, spec, h) {
  const d = A(parent, 'pcard');
  d.innerHTML = `<div class="ph"><img src="${I(src)}" style="max-height:${h}px"></div><div class="nm">${name}</div><div class="sp">${spec}</div>`;
  return d;
}

// ============ S1 — Cold open: the outage ===================================
addScene(0, 4, () => {
  const s = scene('#050505', true);
  const bg = A(s); Object.assign(bg.style, { width: '1920px', height: '1080px' });
  img(bg, I('banner_ultrassom.jpg')).style.cssText = 'width:100%;height:100%;object-fit:cover;display:block';
  const shade = A(s); Object.assign(shade.style, { width: '1920px', height: '1080px', background: 'radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.55), rgba(0,0,0,.92))' });
  const wave = A(s); wave.innerHTML = '<svg width="1920" height="300" viewBox="0 0 1920 300"><path fill="none" stroke-width="5" stroke-linecap="round"/></svg>';
  const wp = wave.querySelector('path');
  const alert = A(s, 'alert', '<i></i>FALHA NA REDE ELÉTRICA');
  const lines = [
    words(s, 'A energia *caiu.*', '', { fontSize: '132px', color: '#fff' }),
    words(s, 'O exame *parou.*', '', { fontSize: '132px', color: '#fff' }),
    words(s, 'O servidor *desligou.*', '', { fontSize: '132px', color: '#fff' }),
    words(s, 'Quanto custa *um segundo?*', '', { fontSize: '140px', color: '#fff' }),
  ];
  lines.forEach(l => l._w.forEach(w => { if (w.classList.contains('it')) w.style.color = '#ff5a4f'; }));
  return { s, bg, shade, wave, wp, alert, lines, times: [0.15, 1.15, 2.15, 3.05] };
}, (t, c) => {
  // lights: on, flicker around 0.5–0.9 s, then dark with brief re-flickers
  const fl = t < 0.45 ? 1 : t < 0.95 ? (Math.sin(t * 90) > 0.2 ? 0.9 : 0.15) : (Math.sin(t * 37) > 0.97 ? 0.3 : 0.08);
  set(c.bg, { s: 1.05 + t * 0.02, o: 0.85, bright: fl * 0.55 });
  set(c.shade, {});
  // mains waveform: healthy sine that collapses to a flat red line
  const amp = t < 0.5 ? 90 : t < 0.95 ? 90 * (0.95 - t) / 0.45 * (Math.sin(t * 70) > 0 ? 1 : 0.4) : 0;
  let d = 'M0,150';
  for (let x = 0; x <= 1920; x += 12) {
    const jitter = t > 0.95 ? Math.sin(x * 0.3 + t * 40) * Math.max(0, 1 - (t - 0.95) * 4) * 10 : 0;
    d += ` L${x},${(150 + Math.sin(x / 1920 * Math.PI * 8 - t * 12) * amp + jitter).toFixed(1)}`;
  }
  c.wp.setAttribute('d', d);
  c.wp.setAttribute('stroke', t < 0.95 ? '#35d07f' : RED);
  set(c.wave, { y: 300, o: 0.85 * (1 - p01(t, 3.4, 3.8)) });
  set(c.alert, { y: -390, o: t < 0.95 ? 0 : (Math.floor(t * 4) % 2 ? 1 : 0.45) * (1 - p01(t, 3.4, 3.8)), s: pop(t, 0.95, 0.5) });
  const collapse = p01(t, 3.45, 3.95, E.inExpo);
  c.lines.forEach((dd, i) => {
    const t0 = c.times[i], t1 = i < 3 ? c.times[i + 1] - 0.05 : 3.9;
    const out = p01(t, t1 - 0.22, t1, E.inCubic);
    rise(dd, t, t0, 0.06, 0.7, 90);
    set(dd, { y: -out * 90, o: (t >= t0 - 0.01 ? 1 : 0) * (1 - out), blur: out * 14, s: i === 3 ? 1 + collapse * 0.25 : 1 });
  });
});

// ============ S2 — Logo reveal =============================================
addScene(4, 8, () => {
  const s = scene('#ffffff');
  const rings = [0, 1, 2].map(() => { const d = A(s); Object.assign(d.style, { width: '260px', height: '260px', borderRadius: '8px', border: `4px solid ${RED}` }); return d; });
  const logo = A(s, '', logoSVG(1400));
  const tag = words(s, '27 anos de *energia garantida.*', '', { fontSize: '64px', fontWeight: 500, color: '#555', letterSpacing: '-0.035em' });

}, (t, c) => {

// ---------------------------------------------------------------------------
// Scene compositor: outgoing scene zooms/blurs away, incoming scales in.
// ---------------------------------------------------------------------------
const OUT = 0.34, IN = 0.42;
window.render = function (t) {
  SCENES.forEach((sc, i) => {
    const s = sc.ctx.s;
    const first = i === 0, last = i === SCENES.length - 1;
    const on = t >= sc.start - (first ? 0 : 0.18) && t < sc.end + (last ? 1 : OUT);
    s.style.visibility = on ? 'visible' : 'hidden';
    if (!on) return;
    sc.update(t, sc.ctx);
    const outP = last ? 0 : p01(t, sc.end - 0.12, sc.end + OUT, E.inCubic);
    const inP = first || i === 1 ? 1 : p01(t, sc.start - 0.18, sc.start + IN, E.outExpo);
    const sOut = 1 + outP * 0.16, sIn = 0.9 + inP * 0.1;
    s.style.transform = `scale(${(sOut * sIn).toFixed(4)})`;
    s.style.opacity = (first || i === 1 ? 1 : clamp(inP * 1.8)).toFixed(3);
    s.style.filter = outP > 0.01 ? `blur(${(outP * 18).toFixed(2)}px)` : 'none';
    s.style.zIndex = String(i);
  });
};
window.DURATION = DURATION;
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => console.warn('img fail', i.src))));
  return true;
})();
// Live preview when opened in a browser: ?t=12.5 freezes a frame, otherwise it plays.
const qs = new URLSearchParams(location.search);
if (!navigator.webdriver) {
  if (qs.has('t')) window.render(parseFloat(qs.get('t')));
  else { const t0 = performance.now(); const loop = () => { window.render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); }; loop(); }
}
</script>
